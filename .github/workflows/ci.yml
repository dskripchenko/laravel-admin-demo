name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, gd, intl, zip
          coverage: none
      - name: Install
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Code style
        run: vendor/bin/pint --test
      - name: Prepare
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Test
        run: php artisan test

  crawl:
    runs-on: ubuntu-latest
    name: Browser crawl
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          composer update --prefer-dist --no-interaction --no-progress
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prepare the stand
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan demo:reset --force
      - name: Crawl every menu entry and docs page as each role
        run: |
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --port=8000 > /tmp/serve.log 2>&1 &
          sleep 3
          BASE_URL=http://127.0.0.1:8000 node tests/e2e/crawl.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/screenshots
          retention-days: 7
